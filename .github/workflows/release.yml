name: Build and Release Chrome Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IMPORTANT for branch checks

      - name: Ensure tag is from prod branch
        run: |
          TAG_COMMIT=$(git rev-list -n 1 $GITHUB_REF_NAME)
          PROD_COMMIT=$(git rev-parse origin/prod)

          if [ "$TAG_COMMIT" != "$PROD_COMMIT" ]; then
            echo "Tag is not on prod branch. Aborting release."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Zip dist folder
        run: |
          cd dist
          zip -r ../ai-code-mentor-${GITHUB_REF_NAME}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-code-mentor-${{ github.ref_name }}.zip
