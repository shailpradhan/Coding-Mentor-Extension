name: Build and Release Chrome Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IMPORTANT for branch checks

      - name: Ensure tag is from prod branch
        run: |
            git fetch origin prod

            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/prod; then
              echo "Tag is not reachable from prod branch. Aborting release."
              exit 1
            fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Zip dist folder
        run: |
          cd dist
          zip -r ../ai-code-mentor-${GITHUB_REF_NAME}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-code-mentor-${{ github.ref_name }}.zip
